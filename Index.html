<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Número Secreto</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>Número Secreto</h1>
    <p class="subtitulo" id="subtitulo">Adivina un número del 1 al 10 en 3 intentos.</p>

    <div class="tablero">
      <div class="secreto" id="secreto" aria-label="Número secreto oculto">?</div>
      <div class="intentos">
        <span>Intentos restantes</span>
        <div id="bolas"></div>
      </div>
    </div>

    <div class="entrada">
      <input id="campoNumero" type="number" min="1" max="10" placeholder="1 a 10">
      <button id="btnAdivinar" type="button">Adivinar</button>
    </div>

    <p id="mensaje">Escribe un número y pulsa Adivinar.</p>

    <p class="probados" id="probados">Probados: <b>—</b></p>

    <div class="marcador">
      <div><span>Ganadas</span><strong id="ganadas">0</strong></div>
      <div><span>Perdidas</span><strong id="perdidas">0</strong></div>
      <div><span>Mejor racha</span><strong id="mejorRacha">0</strong></div>
    </div>

    <button id="btnNueva" type="button">Nueva partida</button>

    <section class="partidas">
      <h2>Historial de partidas</h2>
      <p id="sinPartidas">Aún no has terminado ninguna partida.</p>
      <ol id="listaPartidas"></ol>

      <div class="acciones">
        <button id="btnBorrar" type="button">Borrar historial</button>
        <select id="nivel" aria-label="Dificultad">
          <option value="facil">Fácil (1-10)</option>
          <option value="medio">Medio (1-50)</option>
          <option value="dificil">Difícil (1-100)</option>
        </select>
      </div>
    </section>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
